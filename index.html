      content="Get Groceries, Medicines & More. Rapsap!"

      content="Your hybrid superstore for groceries, dairy, fruits & medicines. Shop in-store or get essentials delivered in 10 minutes. Get what you need, Rapsap!"
    />

    <meta property="og:image" content="/meta.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Get Groceries, Medicines & More. Rapsap!"
    />
    <meta
      name="twitter:description"
      content="Your hybrid superstore for groceries, dairy, fruits & medicines. Shop in-store or get essentials delivered in 10 minutes. Get what you need, Rapsap!"
    />

    <link rel="stylesheet" href="./src/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <title>Rapsap</title>
  </head>
  <body>
    <div id="app">
      <nav class="navbar">
        <a href="/">
          <img src="/logo.svg" class="logo-nav" />
        </a>

        <img class="hamburger" id="hamburger-btn" src="/hamburgerMenu.svg" />

        <div class="nav-items" id="nav-menu">
          <ul>
            <li><a href="/about.html" id="about-link">About</a></li>
            <li><a href="/franchise.html" id="franchise-link">Franchise</a></li>
            <li><a href="/stores.html" id="store-link">Stores</a></li>
          </ul>
        </div>
      </nav>

      <main class="content">
        <p class="title">Essentials delivered,</p>

        <p
          class="animate__animated animate__lightSpeedInLeft animate__faster brand-name"
        >
          rapsap.
        </p>

        <p class="description">
          Experience the store or get it at your door. Simple
        </p>

        <p class="highlight">
          <span>Smooth</span> ordering, <span>Fast</span> delivery.
        </p>

        <!-- <button id="cta" class="cta shimmer">LAUNCHING SOON!</button> -->
        <p class="launch-title shimmer">Launching Soon!</p>
      </main>
    </div>

    <canvas id="rive-canvas" width="900" height="900"></canvas>

    <script src="https://unpkg.com/@rive-app/canvas"></script>
    <script>
      let canvas = document.getElementById("rive-canvas");
      let ctaBtn = document.getElementById("cta");
      let popup = document.getElementById("popup");
      let close = document.getElementById("popup-close");

      const isMobile = window.innerWidth <= 768;

      const riveInstance = new rive.Rive({
        src: window.innerWidth <= 768 ? "/Mobile.riv" : "/Website.riv",
        canvas: canvas,
        autoplay: true,
      });

      const currentPage = window.location.pathname;

      const aboutLink = document.getElementById("about-link");
      const franchiseLink = document.getElementById("franchise-link");
      const storeLink = document.getElementById("store-link");

      const hamburgerBtn = document.getElementById("hamburger-btn");
      const navMenu = document.getElementById("nav-menu");

      if (franchiseLink && currentPage === "/franchise.html") {
        franchiseLink.classList.add("active");
      }
      if (aboutLink && currentPage === "/about.html") {
        aboutLink.classList.add("active");
      }

      if (storeLink && currentPage === "/stores.html") {
        storeLink.classList.add("active");
      }

      if (hamburgerBtn) {
        hamburgerBtn.addEventListener("click", function () {
          if (navMenu) navMenu.classList.toggle("show");
        });
      }
    </script>
  </body>
</html>
