    <canvas id="rive-canvas" width="1000" height="1000"></canvas>
    <script src="https://unpkg.com/@rive-app/canvas"></script>
    <script>
      let canvas = document.getElementById("rive-canvas");
      let ctaBtn = document.getElementById("cta");
      let popup = document.getElementById("popup");
      let close = document.getElementById("popup-close");

      const isMobile = window.innerWidth <= 768;

      const riveInstance = new rive.Rive({
        src: window.innerWidth <= 768 ? "/Mobile.riv" : "/Website.riv",
        canvas: canvas,
        autoplay: true,
      });

      ctaBtn.addEventListener("click", () => {
        popup.style.display = "block";
        popup.style.margin = "auto";
        popup.style.width = isMobile ? "90vw" : "50vw";
        popup.style.zIndex = "1";
        popup.style.borderRadius = "4px";
      });
      close.addEventListener("click", () => {
        popup.style.display = "none";
      });
    </script>
