<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <title>Rapsap</title>
  </head>
  <body>
    <div id="app">
      <nav class="navbar">
        <img src="/logo.svg" />
      </nav>

      <main class="content">
        <p class="title">Essentials delivered,</p>

        <p
          class="animate__animated animate__lightSpeedInLeft animate__faster brand-name"
        >
          rapsap.
        </p>

        <p class="description">
          Helping you discover recipes, order fresh ingredients<br />
          instantly and get them delivered in no time.
        </p>

        <p class="highlight">
          <span>Smooth</span> ordering <span>Fast</span> delivery.
        </p>

        <button class="cta">launching soon</button>
      </main>
    </div>

    <canvas id="rive-canvas" width="1000" height="1000"></canvas>
    <script src="https://unpkg.com/@rive-app/canvas"></script>
    <script>
      let canvas = document.getElementById("rive-canvas");
      const isMobile = window.innerWidth <= 768;

      const riveInstance = new rive.Rive({
        src: window.innerWidth <= 768 ? "/Mobile.riv" : "/Website.riv",
        canvas: canvas,
        autoplay: true,
        fit: rive.Fit.Cover,
      });
    </script>

    <!-- <script type="module" src="/src/main.ts"></script> -->
  </body>
</html>
